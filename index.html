<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creem</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f9f9f9;
    }
    a.logo-button {
      display: inline-block;
      padding: 32px 64px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      text-decoration: none;
    }
    a.logo-button:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    }
    a.logo-button:active {
      transform: scale(0.98);
    }
    a.logo-button img {
      display: block;
      width: 280px;
      height: auto;
    }
  </style>
</head>
<body>
  <a class="logo-button" href="https://creem.io">
    <img src="https://creem.io/new-branding/Logo/SVG/creem%20logo_black_full.svg" alt="Creem">
  </a>
</body>
</html>
